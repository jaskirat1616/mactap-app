name: MacTap
options:
  bundleIdPrefix: app.mactap
  deploymentTarget:
    macOS: "14.6"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.6"
    PRODUCT_BUNDLE_IDENTIFIER: app.mactap.MacTap
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "4"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_LSUIElement: "YES"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Jaskirat Singh. MIT License."
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: "YES"
    CODE_SIGN_ENTITLEMENTS: MacTap/Resources/MacTap.entitlements
targets:
  MacTap:
    type: application
    platform: macOS
    sources:
      - path: MacTap/Sources
      - path: MacTap/Resources/Assets.xcassets
        buildPhase: resources
      - path: MacTap/Resources/Localization
        buildPhase: resources
      - path: MacTap/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: MacTap/Resources/Info.plist
      properties:
        CFBundleName: MacTap
        CFBundleDisplayName: MacTap
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSMotionUsageDescription: "MacTap uses the MacBook's built-in motion sensors to detect physical taps on the chassis and trigger your custom actions."
        NSAppleEventsUsageDescription: "MacTap sends AppleEvents to run AppleScripts and Shortcuts when you tap the chassis."
        NSAppleMusicUsageDescription: "MacTap can control media playback when you tap the chassis."
        NSAccessibilityUsageDescription: "MacTap needs Accessibility access to send keyboard shortcuts and control other applications when you tap the chassis."
        NSInputMonitoringUsageDescription: "MacTap can watch keyboard activity so chassis knocks are ignored while you type. Optional — Accessibility already covers this."
        NSSystemAdministrationUsageDescription: "MacTap needs permission to perform system actions like screenshots and media control when you tap the chassis."
        NSUserNotificationsUsageDescription: "MacTap may send notifications when gestures are detected."
